name: Site runtime image
on:
  push:
    branches: [main]
    paths: ['docker/site-runtime/**', 'ferry-sited/**', '.github/workflows/site-runtime.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 @ 2026-08-17
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3 @ 2026-08-17
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6 @ 2026-08-17
        with:
          context: .
          file: docker/site-runtime/Dockerfile
          build-args: PHP_MINOR=${{ matrix.php }}
          push: true
          tags: ghcr.io/epicwp/ferry-site-runtime:php${{ matrix.php }}
